<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/cadastro_horario.css">
    <title>Cadastro Horários</title>
</head>
<body>
    <header>
        <div>
            <h1> <img class="Logotipo", src="assets/calendar.svg" alt="LogoProtótopo">  Atendimentos </h1>
        </div>
        
        <nav>
            <ul>
                <li> <button onclick="window.location.href='index.html'">Início</button> </li>
                <li> <button onclick="window.location.href='agenda.html'">Agendamentos</button> </li>
            </ul>
        </nav>
        
    </header>
    <section>
        <h2>Cadastro de horários</h2>

        <form id="new_horario" class="novo_horario">
            <div>
                <label for="horarioLivre">Data e hora</label>
                <input type="datetime-local" id="horarioLivre" name="horarioLivre" required>
            </div>

            <input type="submit" value="Cadastrar horário">
        </form>

        <h3>Horários disponíveis</h3>
        
        <div id="free_horarios"></div>

        
        
    </section>

    <script src="scripts/cadastro_horario.js"></script>

</body>
</html>
