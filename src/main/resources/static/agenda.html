<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Atendimentos</title>
    <script src="scripts/agenda.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <h1>
          <img class="logotipo" src="assets/calendar.svg" alt="Logotipo" width="50" />
          Atendimentos
        </h1>
      </div>

      <nav>
        <ul>
          <li><button onclick="location.href='index.html'">Início</button></li>
          <li><button onclick="location.href='agenda.html'">Agendamentos</button></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="calendar-controls">
        <button id="prevMonth" type="button">Mês anterior</button>
        <button id="nextMonth" type="button">Próximo mês</button>
        <button id="clearEvents" type="button">Limpar agendamentos</button>
      </div>

      
    </main>
  </body>
</html>
