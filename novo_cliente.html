<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/clients.css">
    <title>Cadastro Clientes</title>
</head>
<body>
   
    <!-- Menu de cima  -->


    <header>
        <div>
            <h1> <img class="Logotipo", src="assets/calendar.svg" alt="LogoProtótopo">  Atendimentos </h1>
        </div>
        
        <nav>
            <ul>
                <li> <button onclick="window.location.href='index.html'">Início</button> </li>
                <li> <button onclick="window.location.href='agenda.html'">Agendamentos</button> </li>
        
    </header>
    
    <!-- Formulrio de cadastro Clientes -->
    <section>
        <form action="" method="POST" id="newCliente">
            
            <div>
                <label for="name">Nome:</label>
                <input type="text" name="name" id="nome" placeholder="Nome Completo" required>
            </div>

            <div>
                <label for="cpf">CPF:</label>
                <input type='text' 
                name="cpf" 
                id="cpf" 
                placeholder="00000000000"

                maxlength="11"
                required>
            </div>


            <div>
                <label for="number">Idade:</label>
                <input type="number" name="idade" id="idade" placeholder="Idade Ex: 21" required>
            </div>

            <div>
                <input type="reset" value="Reset">
            </div>

            <div>
                <input type="submit" value="Submit">
            </div>

            <div>
                <input type="button" value="Voltar" onclick="window.location.href='clientes.html'">
            </div>

        </form>
    </section>
    <script src="scripts/novo_cliente.js"></script>
</body>
</html>
